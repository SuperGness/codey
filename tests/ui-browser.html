<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" />
  <title>HeroUI 界面回归验证</title>
  <div id="root"></div>
  <script type="module">
    import React from "react";
    import { createRoot } from "react-dom/client";
    import { UiProvider } from "../src/UiProvider.tsx";
    import "../src/dev/mockApi";
    const mock = window.__codeyInvokeApi;
    const view = new URLSearchParams(location.search).get("view");
    const requestedTheme = new URLSearchParams(location.search).get("theme");
    if (requestedTheme === "light" || requestedTheme === "dark") {
      document.documentElement.dataset.theme = requestedTheme;
      document.documentElement.style.colorScheme = requestedTheme;
    }
    if (view === "quota") {
      window.__codeyInvokeApi = async (command, args) => {
        if (command !== "query_route_request_log_quota_usage" || args.provider !== "openai") return mock(command, args);
        const items = [
          { model: "gpt-6-astra", inputTokens: 191090068, outputTokens: 2048123, totalTokens: 193138191, cachedInputTokens: 180000000 },
          { model: "gpt-6-astra", serviceTier: "default", inputTokens: 21349800, outputTokens: 341000, totalTokens: 21690800, cachedInputTokens: 19000000, cacheCreationInputTokens: 50000 },
          { model: "gpt-5.6-luna", inputTokens: 240000, outputTokens: 16000, totalTokens: 256000 },
          { model: "unknown-model", inputTokens: 1000 },
        ];
        return { queryable: true, totalCalls: items.length, groups: items.map(item => {
          const input = item.inputTokens ?? 0, cached = item.cachedInputTokens ?? 0;
          const billedCached = Math.min(input, cached);
          return { ...item, serviceTier: item.serviceTier ?? null, requestedServiceTier: null,
            calls: 1, longContext: input > 272000, outputTokens: item.outputTokens ?? 0,
            totalTokens: item.totalTokens ?? 0, cachedInputTokens: cached,
            cacheCreationInputTokens: item.cacheCreationInputTokens ?? 0, cacheHits: Number(cached > 0),
            missingUsage: Number(item.outputTokens == null || item.totalTokens == null),
            missingCacheCreation: Number(item.cacheCreationInputTokens == null),
            billedCachedInputTokens: billedCached,
            billedCacheCreationInputTokens: Math.min(input - billedCached, item.cacheCreationInputTokens ?? 0) };
        }) };
      };
    }
    if (view === "usage") {
      await import("../src/tailwind.css");
      await import("../src/styles.css");
      const scenario = new URLSearchParams(location.search).get("state");
      window.__codeyInvokeApi = async (command, args) => {
        if (command !== "query_route_request_log_stats") return mock(command, args);
        if (scenario === "error") throw new Error("测试：统计服务暂不可用");
        if (scenario === "loading") return new Promise(() => {});
        if (scenario === "unavailable") return { queryable: false, reason: "ndjson_not_queryable" };
        const result = await mock(command, args);
        if (scenario === "calendar") {
          // Explicit daily fixtures, independent from the coarser histogram buckets.
          const dayMs = 86400000;
          if (args.allTime) result.fromUnixMs = Date.UTC(new Date(result.toUnixMs).getUTCFullYear() - 2, 0, 1);
          result.dailyTrend = [];
          for (let day = Math.floor(result.fromUnixMs / dayMs) * dayMs, index = 0; day < result.toUnixMs; day += dayMs, index++) {
            if (index % 6 === 0) continue;
            result.dailyTrend.push({ timestampUnixMs: day, total: 4, totalTokensKnownCount: index % 9 === 0 ? 0 : index % 7 === 0 ? 3 : 4, totalTokensSum: index % 9 === 0 ? null : index % 8 === 0 ? 0 : (index % 5 + 1) ** 2 * 12345 });
          }
        }
        if (scenario === "legacy") delete result.dailyTrend;
        if (scenario === "empty") return { ...result, total: 0, groups: [], trend: [] };
        if (scenario === "recording-off") result.recordingHealth = { ...result.recordingHealth, enabled: false, active: false };
        if (scenario === "unknown") {
          result.totalTokensSum = result.inputTokensSum = result.outputTokensSum = result.cachedTokensSum = null;
          result.totalTokensKnownCount = 0;
          result.groups = result.groups.map((group) => ({ ...group, totalTokensSum: null }));
          result.trend = result.trend.map((bucket) => ({ ...bucket, totalTokensSum: null }));
          result.dailyTrend = result.dailyTrend?.map((bucket) => ({ ...bucket, totalTokensSum: null, totalTokensKnownCount: 0 }));
        }
        if (scenario === "many") {
          result.total = 600;
          result.totalTokensKnownCount = 520;
          result.totalTokensSum = 90000000;
          result.groupsTruncated = true;
          result.groups = Array.from({ length: 50 }, (_, index) => ({ ...result, groups: undefined, trend: undefined, key: `gpt-model-${index}-very-long-model-name-for-responsive-layout-${"long".repeat(10)}`, total: 10, totalTokensSum: (50 - index) * 50000 }));
          result.recordingHealth.sampleRatePerMillion = 500000;
        }
        return result;
      };
      const { UsageAnalysisPanel } = await import("../src/UsageAnalysisPanel.tsx");
      createRoot(document.getElementById("root")).render(React.createElement(UiProvider, null,
        React.createElement("main", { className: "app-shell" },
          React.createElement("div", { className: "page-scroll" },
            React.createElement(UsageAnalysisPanel, { onBack() { location.href = new URL("ui-browser.html", location.href).href; } })))));
    } else if (view === "logs" || view === "quota") {
      const { installRequestLogTheme } = await import("../src/requestLogTheme.ts");
      installRequestLogTheme();
      await import("../src/tailwind.css");
      await import("../src/styles.css");
      const { RequestLogDialog } = await import("../src/RequestLogDialog.tsx");
      const { config } = await mock("load_codey_config", {});
      createRoot(document.getElementById("root")).render(
        React.createElement(UiProvider, null,
          React.createElement(RequestLogDialog, { catalog: { ...config, officialAccountAvailable: true }, opened: true, standalone: true, onClose() {} }))
      );
    } else {
      if (new URLSearchParams(location.search).get("theme") === "dark" || new URLSearchParams(location.search).get("check") === "theme-sync") {
        document.documentElement.style.colorScheme = "dark";
        document.body.style.background = "#181818";
        document.body.style.color = "#ffffff";
      }
      window.__codexSessionDeleteBridge = (path, args) => mock(path.split("/").pop(), args);
      await import("../src/overlay.tsx");
      const button = document.createElement("button");
      button.textContent = "打开内嵌设置";
      button.onclick = () => window.__codeySettingsOverlay.open();
      document.body.append(button);
      window.__codeySettingsOverlay.open();
      if (new URLSearchParams(location.search).get("check") === "theme-sync") {
        const host = document.querySelector("#codey-settings-overlay-host");
        const containers = ["codey-overlay-root", "codey-overlay-modal-container"].map(id => host.shadowRoot.getElementById(id));
        const expectTheme = (theme) => {
          if (containers.some(container => container.dataset.theme !== theme || getComputedStyle(container).colorScheme !== theme)) {
            throw new Error(`主题同步失败：预期 ${theme}`);
          }
        };
        const nextFrame = () => new Promise(requestAnimationFrame);
        expectTheme("dark");
        document.documentElement.dataset.theme = "light";
        await nextFrame();
        expectTheme("light");
        document.documentElement.dataset.theme = "dark";
        await nextFrame();
        expectTheme("dark");
        delete document.documentElement.dataset.theme;
        document.documentElement.classList.add("light");
        await nextFrame();
        expectTheme("light");
        document.documentElement.classList.remove("light");
        document.documentElement.classList.add("dark");
        await nextFrame();
        expectTheme("dark");
        window.__codeySettingsOverlay.close();
        document.documentElement.classList.remove("dark");
        document.documentElement.style.colorScheme = "light";
        window.__codeySettingsOverlay.open();
        expectTheme("light");
        document.documentElement.style.colorScheme = "dark";
        await nextFrame();
        expectTheme("dark");
        const result = document.createElement("pre");
        result.id = "theme-sync-result";
        result.textContent = "PASS：首次打开、主题属性、主题类、颜色方案及关闭后重开均同步两个挂载容器";
        document.body.append(result);
      }
      if (new URLSearchParams(location.search).get("check") === "toast-close") {
        const { toast } = await import("@heroui/react");
        const shadow = document.querySelector("#codey-settings-overlay-host").shadowRoot;
        const nextFrame = () => new Promise(requestAnimationFrame);
        const waitFor = async (read) => {
          const deadline = performance.now() + 5000;
          while (!read()) {
            if (performance.now() > deadline) throw new Error("Toast 回归验证等待超时");
            await nextFrame();
          }
        };
        await waitFor(() => shadow.querySelector('button[aria-label="删除Telegram通知渠道"]'));
        for (const nested of [true, false]) {
          if (nested) {
            toast.info("打开前的外层提示", { timeout: 0 });
            await waitFor(() => [...shadow.querySelectorAll('.settings-modal-shell [data-slot="toast"]')].some(t => t.textContent.includes("打开前的外层提示")));
            shadow.querySelector('button[aria-label="删除Telegram通知渠道"]').click();
            const deadline = performance.now() + 650;
            while (performance.now() < deadline) {
              await nextFrame();
              if ([...shadow.querySelectorAll('.confirmation-dialog [data-slot="toast"]')].some(t => t.textContent.includes("打开前的外层提示"))) throw new Error("打开嵌套弹窗时旧 Toast 移到了新弹窗");
            }
            await waitFor(() => shadow.querySelector(".confirmation-dialog .toast-portal-host"));
            if (toast.getQueue().visibleToasts.some(t => t.content.title === "打开前的外层提示")) throw new Error("打开嵌套弹窗后仍有旧 Toast");
          }
          const dialog = shadow.querySelector(nested ? ".confirmation-dialog" : ".settings-modal-shell");
          toast.info("关闭弹窗提示回归验证", { timeout: 0 });
          await waitFor(() => [...dialog.querySelectorAll('[data-slot="toast"]')].some(t => t.textContent.includes("关闭弹窗提示回归验证")));
          if (nested) dialog.querySelector('button[aria-label="关闭"]').click();
          else window.__codeySettingsOverlay.close();
          const deadline = performance.now() + 650;
          while (performance.now() < deadline) {
            await nextFrame();
            for (const notice of shadow.querySelectorAll('[data-slot="toast"]')) {
              if (notice.textContent.includes("关闭弹窗提示回归验证") && !dialog.contains(notice)) throw new Error(`${nested ? "嵌套" : "设置"}弹窗关闭时 Toast 移到了外层：${notice.textContent}`);
            }
          }
          if (toast.getQueue().visibleToasts.some(t => t.content.title === "关闭弹窗提示回归验证")) throw new Error("关闭后仍有旧 Toast");
        }
        window.__codeySettingsOverlay.open();
        await waitFor(() => shadow.querySelector(".settings-modal-shell .toast-portal-host"));
        if (shadow.querySelector('[data-slot="toast"]')) throw new Error("重新打开后出现旧 Toast");
        toast.success("重新打开后可以显示新提示", { timeout: 0 });
        await waitFor(() => shadow.querySelector('.settings-modal-shell [data-slot="toast"]'));
        const result = document.createElement("pre");
        result.id = "toast-close-result";
        result.textContent = "PASS：打开嵌套弹窗时旧提示未移入，关闭弹窗时提示未移到外层，新提示正常";
        shadow.querySelector(".settings-modal-body").prepend(result);
      }
      if (new URLSearchParams(location.search).get("check") === "notification-close") {
        const shadow = document.querySelector("#codey-settings-overlay-host").shadowRoot;
        const nextFrame = () => new Promise(requestAnimationFrame);
        const waitFor = async (read) => {
          const deadline = performance.now() + 5000;
          while (!read()) {
            if (performance.now() > deadline) throw new Error("通知弹窗回归验证等待超时");
            await nextFrame();
          }
        };
        await waitFor(() => shadow.querySelector('button[aria-label="编辑Telegram Bot通知渠道"]'));
        let frames = 0;
        for (const mode of ["edit", "add"]) {
          for (const close of ["关闭", "取消", "Escape"]) {
            const trigger = mode === "edit"
              ? shadow.querySelector('button[aria-label="编辑Telegram Bot通知渠道"]')
              : shadow.querySelector(".notification-add-actions button");
            trigger.click();
            await waitFor(() => shadow.querySelector(".notification-channel-dialog .notification-dialog-fields"));
            const dialog = shadow.querySelector(".notification-channel-dialog");
            await waitFor(() => !dialog.closest(".modal__backdrop").getAnimations({ subtree: true }).length);
            const heading = dialog.querySelector("h2").textContent;
            if (heading !== (mode === "edit" ? "编辑Telegram渠道" : "添加通知渠道")) throw new Error(`重新打开时模式错误：${heading}`);
            const height = dialog.getBoundingClientRect().height;
            if (close === "Escape") dialog.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
            else [...dialog.querySelectorAll("button")].find(button => button.getAttribute("aria-label") === close || button.textContent.trim() === close).click();
            const deadline = performance.now() + 2000;
            while (dialog.isConnected) {
              if (performance.now() > deadline) throw new Error("通知弹窗未完成关闭");
              if (!dialog.querySelector(".notification-dialog-fields") || dialog.querySelector("h2")?.textContent !== heading || dialog.getBoundingClientRect().height < height * 0.9) throw new Error(`${mode}/${close}：关闭动画中表单消失、模式改变或高度收缩`);
              frames++;
              await nextFrame();
            }
          }
        }
        if (frames < 6) throw new Error("未采集到足够的关闭动画帧");
        const result = document.createElement("pre");
        result.id = "notification-close-result";
        result.textContent = `PASS：新增和编辑通知渠道的关闭按钮、取消、Esc 共检查 ${frames} 帧，表单及模式保留至卸载`;
        shadow.querySelector(".settings-modal-body").prepend(result);
      }
      if (new URLSearchParams(location.search).get("check") === "dialog-motion") {
        const shadow = document.querySelector("#codey-settings-overlay-host").shadowRoot;
        const nextFrame = () => new Promise(requestAnimationFrame);
        const deadline = performance.now() + 5000;
        let trigger;
        while (!(trigger = shadow.querySelector('button[aria-label="删除Telegram通知渠道"]'))) {
          if (performance.now() > deadline) throw new Error("确认弹窗入口未加载");
          await nextFrame();
        }
        trigger.click();
        const frames = [];
        const start = performance.now();
        while (performance.now() - start < 600) {
          await nextFrame();
          const dialog = shadow.querySelector(".confirmation-dialog");
          if (!dialog) continue;
          const backdrop = dialog.closest(".modal__backdrop");
          const rect = dialog.getBoundingClientRect();
          frames.push({ center: rect.x + rect.width / 2, overflow: backdrop.scrollWidth > backdrop.clientWidth || backdrop.scrollHeight > backdrop.clientHeight });
        }
        const drift = Math.max(...frames.map(frame => frame.center)) - Math.min(...frames.map(frame => frame.center));
        const passed = frames.length > 2 && drift < 0.5 && frames.every(frame => !frame.overflow);
        const result = document.createElement("pre");
        result.id = "motion-result";
        result.textContent = `${passed ? "PASS" : "FAIL"}：${frames.length} 帧，横向位移 ${drift.toFixed(3)}px`;
        shadow.querySelector(".confirmation-dialog").append(result);
        if (!passed) throw new Error(result.textContent);
      }
    }
  </script>
</html>
