<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" />
  <title>Shadow DOM 样式回归</title>
  <pre id="result">正在检查…</pre>
  <iframe id="reference" title="独立页面对照"></iframe>
  <div id="embedded"></div>
  <script type="module">
    import css from "../src/tailwind.css?inline";
    import coreCss from "../src/styles.css?inline";
    import { shadowStyleSheet } from "../src/shadowStyles.ts";
    const markup = `<style>* { transition: none !important; }</style><div data-theme="light">
      <input class="input" aria-label="线路名" value="示例线路">
      <button class="select__trigger">上游协议</button>
      <div class="select__popover">OpenAI Responses</div>
      <div class="autocomplete__popover">模型选项</div>
      <div class="combo-box__popover">手动模型选项</div>
      <div class="modal__dialog">编辑线路</div>
    </div>`;
    const shadow = document.querySelector("#embedded").attachShadow({ mode: "open" });
    shadow.adoptedStyleSheets = [shadowStyleSheet(css, coreCss)];
    shadow.innerHTML = markup;
    const frame = document.querySelector("#reference");
    const loaded = new Promise((resolve) => frame.addEventListener("load", resolve, { once: true }));
    frame.srcdoc = `<style>${css}${coreCss}</style>${markup}`;
    await loaded;
    const properties = ["borderTopWidth", "borderTopStyle", "borderTopColor", "borderRadius", "boxShadow"];
    const failures = [];
    for (const selector of [".input", ".select__trigger", ".select__popover", ".autocomplete__popover", ".combo-box__popover", ".modal__dialog"]) {
      const actual = getComputedStyle(shadow.querySelector(selector));
      const expected = frame.contentWindow.getComputedStyle(frame.contentDocument.querySelector(selector));
      for (const property of properties) {
        if (actual[property] !== expected[property]) failures.push(`${selector} ${property}: ${actual[property]} != ${expected[property]}`);
      }
    }
    const popup = getComputedStyle(shadow.querySelector(".select__popover"));
    if (popup.boxShadow === "none" || popup.borderRadius === "0px") failures.push("下拉弹层轮廓缺失");
    const input = shadow.querySelector(".input");
    input.focus();
    const focusedShadow = getComputedStyle(input).boxShadow;
    const referenceInput = frame.contentDocument.querySelector(".input");
    referenceInput.focus();
    if (focusedShadow === "none" || focusedShadow !== frame.contentWindow.getComputedStyle(referenceInput).boxShadow) failures.push("输入框焦点轮廓与独立页面不一致");
    // 模拟 Codex 在浅色和深色外观之间切换，弹层不能继承宿主的文字颜色。
    for (const color of ["rgb(29, 29, 31)", "rgb(255, 255, 255)", "rgb(29, 29, 31)"]) {
      document.body.style.color = color;
      const popover = shadow.querySelector(".combo-box__popover");
      popover.innerHTML = `<div class="list-box"><div class="list-box-item">普通模型</div><div class="list-box-item" data-selected="true">选中模型</div></div>`;
      const item = getComputedStyle(popover.querySelector(".list-box-item"));
      const selected = getComputedStyle(popover.querySelector('[data-selected="true"]'));
      if (item.color !== "rgb(29, 29, 31)") failures.push(`宿主 ${color}：普通选项文字颜色错误 ${item.color}`);
      if (selected.color !== "rgb(255, 255, 255)" || selected.backgroundColor !== "rgb(0, 122, 255)") failures.push("选中选项未保持蓝底白字");
      popover.querySelector('[data-selected="true"]').setAttribute("data-hovered", "true");
      const hovered = getComputedStyle(popover.querySelector('[data-selected="true"]'));
      if (hovered.color !== "rgb(255, 255, 255)" || hovered.backgroundColor !== "rgb(0, 113, 235)") failures.push("选中选项悬停配色错误");
    }
    document.querySelector("#result").textContent = failures.length ? `FAIL\n${failures.join("\n")}` : "PASS：6 类控件样式及焦点轮廓正常；宿主深浅色切换时，普通、选中及悬停选项配色正常";
    if (failures.length) throw new Error(failures.join("\n"));
  </script>
</html>
