<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" />
  <title>Ant Design 界面回归验证</title>
  <div id="root"></div>
  <script type="module">
    import React from "react";
    import { createRoot } from "react-dom/client";
    import { UiProvider } from "../src/UiProvider.tsx";
    import "../src/dev/mockApi";
    const mock = window.__codeyInvokeApi;
    const view = new URLSearchParams(location.search).get("view");
    if (view === "quota") {
      window.__codeyInvokeApi = async (command, args) => {
        if (command !== "query_route_request_logs" || args.provider !== "openai") return mock(command, args);
        return { queryable: true, hasMore: false, items: [
          { model: "gpt-6-astra", inputTokens: 191090068, outputTokens: 2048123, totalTokens: 193138191, cachedInputTokens: 180000000 },
          { model: "gpt-6-astra", serviceTier: "default", inputTokens: 21349800, outputTokens: 341000, totalTokens: 21690800, cachedInputTokens: 19000000, cacheCreationInputTokens: 50000 },
          { model: "gpt-5.6-luna", inputTokens: 240000, outputTokens: 16000, totalTokens: 256000 },
          { model: "unknown-model", inputTokens: 1000 },
        ] };
      };
    }
    if (view === "logs" || view === "quota") {
      await import("../src/tailwind.css");
      await import("../src/styles.css");
      const { RequestLogDialog } = await import("../src/RequestLogDialog.tsx");
      const { config } = await mock("load_codey_config", {});
      createRoot(document.getElementById("root")).render(
        React.createElement(UiProvider, null,
          React.createElement(RequestLogDialog, { catalog: { ...config, officialAccountAvailable: true }, opened: true, standalone: true, onClose() {} }))
      );
    } else {
      window.__codexSessionDeleteBridge = (path, args) => mock(path.split("/").pop(), args);
      await import("../src/overlay.tsx");
      const button = document.createElement("button");
      button.textContent = "打开内嵌设置";
      button.onclick = () => window.__codeySettingsOverlay.open();
      document.body.append(button);
      window.__codeySettingsOverlay.open();
    }
  </script>
</html>
