[workspace]
members = [
  "backend",
  "vendor/CodeyRuntime/crates/codey-runtime-core",
  "vendor/CodeyRuntime/crates/codey-runtime-data",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.9.13"
license = "AGPL-3.0-only"

[workspace.dependencies]
anyhow = "1"
arc-swap = "1"
base64 = "0.22"
bytes = "1"
directories = "6"
fs2 = "0.4"
futures-util = "0.3"
reqwest = { version = "0.12", features = ["http2", "json", "stream", "rustls-tls", "rustls-tls-native-roots", "system-proxy"], default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "time"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
toml = "0.8"
toml_edit = "0.22"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.dev.package.codey-runtime-data]
opt-level = 3

[profile.dev.package.memchr]
opt-level = 3

[profile.dev.package.serde_json]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# The request-observation writer is isolated with catch_unwind. Unwinding is
# required for a writer panic to degrade logging instead of terminating the
# latency-sensitive router process.
panic = "unwind"
strip = "symbols"
