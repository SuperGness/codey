  <text class="footer-description" x="1164" y="315" text-anchor="end" fill="#95ABC1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16">Codex 桌面增强 · 功能概览</text>
