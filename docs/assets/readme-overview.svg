<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Codey 功能概览</title>
  <desc id="desc">模型与账号、会话与协作、工具与反馈：在 Codex 桌面客户端中管理日常工作。</desc>
  <style>
    @media (max-width: 600px) {
      .headings { font-size: 46px; }
      .subtitles, .footer-description { display: none; }
    }
  </style>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111B27"/>
      <stop offset="1" stop-color="#1D2E40"/>
    </linearGradient>
    <linearGradient id="connection" x1="204" y1="117" x2="996" y2="117" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67C5F5"/>
      <stop offset="0.5" stop-color="#9CB6FF"/>
      <stop offset="1" stop-color="#86D6C0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" rx="20" fill="url(#background)"/>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="19.5" stroke="#71869C" stroke-opacity="0.22"/>
  <path d="M36 282H1164" stroke="#71869C" stroke-opacity="0.22"/>
  <path d="M400 36V250M800 36V250" stroke="#71869C" stroke-opacity="0.18"/>
  <path d="M244 117H556M644 117H956" stroke="url(#connection)" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="4 8"/>
  <circle cx="400" cy="117" r="4" fill="#8BAFDF"/>
  <circle cx="800" cy="117" r="4" fill="#92C3D5"/>

  <g transform="translate(200 117)" stroke="#83D4FC" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
    <circle r="44" fill="#182F42" stroke="#31546F" stroke-width="1"/>
    <path d="M-10 0H10M-10 0V-17H10M-10 0V17H10"/>
    <rect x="-24" y="-7" width="14" height="14" rx="4" fill="#18344A"/>
    <rect x="10" y="-24" width="14" height="14" rx="4" fill="#18344A"/>
    <rect x="10" y="-7" width="14" height="14" rx="4" fill="#18344A"/>
    <rect x="10" y="10" width="14" height="14" rx="4" fill="#18344A"/>
  </g>

  <g transform="translate(600 117)" stroke="#B7C8FF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
    <circle r="44" fill="#26334E" stroke="#465778" stroke-width="1"/>
    <path d="M-13 6V-19A5 5 0 0 1-8-24H22A5 5 0 0 1 27-19V0A5 5 0 0 1 22 5H13"/>
    <path d="M-22-8H8A5 5 0 0 1 13-3V16A5 5 0 0 1 8 21H-11L-23 28V21A5 5 0 0 1-27 16V-3A5 5 0 0 1-22-8Z" fill="#26334E"/>
    <path d="M-16 3H2M-16 11H-3"/>
  </g>

  <g transform="translate(1000 117)" stroke="#9BE5CF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
    <circle r="44" fill="#203F44" stroke="#3A666B" stroke-width="1"/>
    <path d="M-21 20H21M-17 9V-2M-5 9V-13M7 9V-5M19 9V-23"/>
    <circle cx="19" cy="-23" r="4" fill="#9BE5CF" stroke="none"/>
