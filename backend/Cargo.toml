[package]
name = "codey"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "codey"

[package.metadata.cargo-machete]
ignored = ["winres"]

[lib]
name = "codey_lib"
crate-type = ["rlib"]

[[bin]]
name = "codey"
path = "src/main.rs"

[[bin]]
name = "codey-fastctx"
path = "src/bin/codey-fastctx.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
bytes.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
codey-runtime-core = { path = "../vendor/CodeyRuntime/crates/codey-runtime-core" }
codey-runtime-data = { path = "../vendor/CodeyRuntime/crates/codey-runtime-data" }
directories = "6"
fastctx = { git = "https://github.com/yc-duan/fastctx", rev = "22b40ea324a186a921dfe38c205e3ffacdf6546d", default-features = false }
fs2 = "0.4"
futures-util.workspace = true
hyper-util = { version = "0.1", features = ["client-proxy", "client-proxy-system"], default-features = false }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
reqwest = { version = "0.12", features = ["http2", "json", "socks", "stream", "rustls-tls", "rustls-tls-native-roots", "system-proxy"], default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2.workspace = true
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.26"
toml_edit = "0.22"
uuid = { version = "1", features = ["v4"] }
zstd = "0.13"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[[bench]]
name = "fastctx_protocol"
harness = false

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[target.'cfg(windows)'.dependencies]
rfd = { version = "0.15", default-features = false, features = ["common-controls-v6"] }
windows = { version = "0.58", default-features = false, features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = { version = "0.3.1", default-features = false, features = ["objc2", "std"] }
objc2 = { version = "0.6.4", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSApplication",
  "NSControl",
  "NSGraphics",
  "NSPanel",
  "NSResponder",
  "NSTextField",
  "NSView",
  "NSWindow",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSGeometry",
  "NSObject",
  "NSString",
] }
rfd = { version = "0.15", default-features = false }
