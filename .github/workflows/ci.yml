name: Quality checks

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  quality:
    name: TypeScript, JavaScript, and Rust
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codey
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11.5.2"
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false

      - name: Test native Windows MCP protocol
        working-directory: vendor/ComputerUse/windows
        run: go test ./...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit frontend and build dependencies
        run: pnpm audit --audit-level moderate --registry=https://registry.npmjs.org

      - name: TypeScript check
        run: pnpm run check

      - name: JavaScript tests
        run: pnpm run test:js

      - name: Frontend production build
        run: pnpm run vite:build

      - name: Rust formatting
        run: cargo fmt --all -- --check

      # dist-overlay was just built above; tell build.rs not to run Vite again.
      - name: Build Antigravity library for ABI tests
        run: cargo build -p codey-plugin-antigravity-router --locked

      - name: Rust tests
        run: cargo test --workspace --locked
        env:
          CODEY_SKIP_OVERLAY_BUILD: "1"

      - name: Rust lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
        env:
          CODEY_SKIP_OVERLAY_BUILD: "1"

  windows-rust:
    name: Windows Rust
    runs-on: windows-latest

    steps:
      - name: Checkout Codey
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11.5.2"
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false

      - name: Test native Windows MCP protocol
        working-directory: vendor/ComputerUse/windows
        run: go test ./...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build embedded frontend assets
        run: pnpm run vite:build

      - name: Build Antigravity library for ABI tests
        run: cargo build -p codey-plugin-antigravity-router --locked

      - name: Test Windows workspace
        run: cargo test --workspace --locked
        env:
          CODEY_SKIP_OVERLAY_BUILD: "1"

      - name: Compile native overlay helper and test identity guards
        shell: powershell
        run: ./tests/overlay-recovery-native.ps1

      - name: Lint Windows workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
        env:
          CODEY_SKIP_OVERLAY_BUILD: "1"
